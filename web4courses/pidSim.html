<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PID Motor Kontrol Simülatörü</title>
    <!-- Bağımlılıklar: React, ReactDOM, PropTypes ve Recharts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        input[type="range"] { accent-color: #4f46e5; }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        // Recharts global objesinden bileşenleri güvenli bir şekilde alıyoruz
        const { 
            LineChart, Line, XAxis, YAxis, CartesianGrid, 
            Tooltip, Legend, ResponsiveContainer, ReferenceLine 
        } = window.Recharts;

        // İkonlar için basit SVG bileşenleri
        const SettingsIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
        const ActivityIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
        const TargetIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const RefreshIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>;

        const App = () => {
            // Kontrolör Parametreleri
            const [kp, setKp] = useState(2.0);
            const [ki, setKi] = useState(0.5);
            const [kd, setKd] = useState(1.0);
            
            // Sistem (Motor) Parametreleri
            const [a, setA] = useState(0.1);
            const [b, setB] = useState(0.92);
            
            // Hedef ve Adım Ayarları
            const [target, setTarget] = useState(100);
            const [steps, setSteps] = useState(60);
            const [showTable, setShowTable] = useState(false);

            // Simülasyon Motoru: y(t+1) = b*y(t) + a*u(t)
            const data = useMemo(() => {
                let history = [];
                let y = 0;           
                let integral = 0;    
                let prevError = 0;   

                for (let t = 0; t < steps; t++) {
                    const error = target - y;
                    integral += error;
                    const derivative = error - prevError;

                    // PID Hesaplama: u(t) = Kp*e + Ki*sum(e) + Kd*diff(e)
                    const u = (kp * error) + (ki * integral) + (kd * derivative);
                    
                    history.push({
                        t: t,
                        y: Number(y.toFixed(2)),
                        error: Number(error.toFixed(2)),
                        u: Number(u.toFixed(2)),
                        integral: Number(integral.toFixed(2))
                    });

                    // Sistem Diferansiyel Denklemi
                    const nextY = (b * y) + (a * u);
                    
                    prevError = error;
                    y = nextY;
                }
                return history;
            }, [kp, ki, kd, a, b, target, steps]);

            const isStable = Math.abs(b) < 1;

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-8">
                    {/* Üst Bilgi Alanı */}
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-slate-800 flex items-center gap-3">
                                <span className="p-2 bg-indigo-600 rounded-lg text-white">
                                    <ActivityIcon />
                                </span>
                                PID & Motor Simülatörü
                            </h1>
                            <p className="text-slate-500 mt-1 italic">Model: y(t+1) = {b}·y(t) + {a}·u(t)</p>
                        </div>
                        <button 
                            onClick={() => {setKp(2); setKi(0.5); setKd(1); setA(0.1); setB(0.92); setTarget(100);}}
                            className="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-lg shadow-sm hover:bg-slate-50 text-slate-600 font-semibold transition-all"
                        >
                            <RefreshIcon /> Sıfırla
                        </button>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* Kontrol Paneli */}
                        <aside className="lg:col-span-4 space-y-6">
                            
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-6 flex items-center gap-2">
                                    <SettingsIcon /> PID Kontrolör Kazançları
                                </h2>
                                <div className="space-y-8">
                                    <Slider label="Kp (Oransal)" val={kp} set={setKp} min={0} max={10} step={0.1} color="indigo" />
                                    <Slider label="Ki (İntegral)" val={ki} set={setKi} min={0} max={2} step={0.01} color="emerald" />
                                    <Slider label="Kd (Türev)" val={kd} set={setKd} min={0} max={10} step={0.1} color="rose" />
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-6 flex items-center gap-2">
                                    <SettingsIcon /> Sistem Dinamiği
                                </h2>
                                <div className="space-y-8">
                                    <Slider label="b (Atalet)" val={b} set={setB} min={0} max={1.1} step={0.01} color="slate" />
                                    <Slider label="a (Kazanç)" val={a} set={setA} min={0} max={1} step={0.01} color="slate" />
                                    <Slider label="Hedef" val={target} set={setTarget} min={0} max={200} step={5} color="orange" />
                                </div>
                            </div>

                            {!isStable && (
                                <div className="bg-red-50 border border-red-200 p-4 rounded-xl text-red-700">
                                    <div className="font-bold">⚠️ Uyarı:</div>
                                    <div className="text-sm">b ≥ 1 olduğu için sistem kararsız!</div>
                                </div>
                            )}
                        </aside>

                        {/* Grafik Alanı */}
                        <main className="lg:col-span-8 space-y-6">
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-[500px]">
                                <h2 className="text-lg font-bold flex items-center gap-2 text-slate-700 mb-4">
                                    <TargetIcon /> Zaman Cevabı
                                </h2>
                                <ResponsiveContainer width="100%" height="90%">
                                    <LineChart data={data}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="t" stroke="#94a3b8" fontSize={12} />
                                        <YAxis stroke="#94a3b8" fontSize={12} />
                                        <Tooltip 
                                            contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}
                                        />
                                        <Legend verticalAlign="top" align="right" />
                                        <ReferenceLine y={target} stroke="#f97316" strokeDasharray="5 5" strokeWidth={2} />
                                        <Line 
                                            type="monotone" 
                                            dataKey="y" 
                                            name="Konum (y)" 
                                            stroke="#4f46e5" 
                                            strokeWidth={3} 
                                            dot={false}
                                            animationDuration={300}
                                        />
                                        <Line 
                                            type="monotone" 
                                            dataKey="u" 
                                            name="PID (u)" 
                                            stroke="#94a3b8" 
                                            strokeWidth={1} 
                                            strokeDasharray="3 3" 
                                            dot={false} 
                                        />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>

                            {/* Detay Tablosu */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <button onClick={() => setShowTable(!showTable)} className="w-full p-4 text-left font-bold text-slate-700 border-b flex justify-between items-center hover:bg-slate-50">
                                    <span>{showTable ? 'Tabloyu Gizle' : 'Veri Detaylarını Göster'}</span>
                                    <span className="text-xs text-slate-400 font-normal">İlk 15 Adım</span>
                                </button>
                                {showTable && (
                                    <div className="max-h-60 overflow-y-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] sticky top-0">
                                                <tr>
                                                    <th className="p-3">t (Zaman)</th>
                                                    <th className="p-3">y (Konum)</th>
                                                    <th className="p-3">e (Hata)</th>
                                                    <th className="p-3">u (Sinyal)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {data.slice(0, 15).map(row => (
                                                    <tr key={row.t} className="hover:bg-indigo-50/30">
                                                        <td className="p-3 font-mono">{row.t}</td>
                                                        <td className="p-3 font-bold text-indigo-600">{row.y}</td>
                                                        <td className="p-3 text-red-500">{row.error}</td>
                                                        <td className="p-3">{row.u}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>

                    <footer className="mt-8 p-6 bg-indigo-900 rounded-2xl text-white text-center shadow-lg">
                        <div className="text-3xl font-bold">{data[steps-1].y}</div>
                        <div className="text-xs uppercase tracking-widest opacity-60">Son Pozisyon</div>
                    </footer>
                </div>
            );
        };

        const Slider = ({ label, val, set, min, max, step, color }) => {
            const colorMap = {
                indigo: 'bg-indigo-600',
                emerald: 'bg-emerald-600',
                rose: 'bg-rose-600',
                slate: 'bg-slate-600',
                orange: 'bg-orange-500'
            };
            return (
                <div>
                    <div className="flex justify-between mb-2">
                        <label className="text-xs font-bold text-slate-500 uppercase">{label}</label>
                        <span className={`text-xs font-mono font-bold px-2 py-0.5 rounded ${colorMap[color]} text-white`}>{val}</span>
                    </div>
                    <input 
                        type="range" min={min} max={max} step={step} 
                        value={val} 
                        onChange={(e) => set(parseFloat(e.target.value))}
                        className="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer hover:bg-slate-300 transition-colors"
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
